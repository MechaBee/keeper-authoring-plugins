view:
  id: request_detail
  title: Request detail

nav:
  visible: false

route_state:
  selected_request_id: requestId

state:
  selected_request_id: ""

data_sources:
  selected_request:
    kind: record
    table: requests
    id:
      bind: state.selected_request_id
    refresh_on:
      - state.selected_request_id

components:
  detail_toolbar:
    kind: toolbar
    title: Request actions
    items:
      - id: edit_request
        kind: link
        label: Edit request
        viewId: request_edit
        appearance: secondary
        query:
          requestId:
            bind: state.selected_request_id
  request_detail:
    kind: record_detail
    table: requests
    data_source: selected_request
    mode: read_only
    show_primary_key: false
    empty_message: Choose a request from the register.
    header:
      title_field: title
      meta_fields:
        - status
        - priority
        - due_date
    sections:
      - id: ownership
        title: Ownership
        columns: 2
        fields:
          - field: requester
          - field: owner
          - field: created_at
          - field: updated_at
      - id: request
        title: Request
        fields:
          - field: description
            contentFormat: markdown
            ui:
              variant: markdown
              width: full
      - id: decision
        title: Decision
        fields:
          - field: decision_notes
            contentFormat: markdown
            ui:
              variant: markdown
              width: full

layout:
  kind: stack
  children:
    - component: detail_toolbar
    - component: request_detail
