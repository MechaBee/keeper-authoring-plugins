view:
  id: request_edit
  title: Edit request

nav:
  visible: false

route_state:
  selected_request_id: requestId

state:
  selected_request_id: ""

data_sources:
  selected_request:
    kind: record
    table: requests
    id:
      bind: state.selected_request_id
    refresh_on:
      - state.selected_request_id

components:
  edit_toolbar:
    kind: toolbar
    title: Navigation
    items:
      - id: back_to_detail
        kind: link
        label: Back to detail
        viewId: request_detail
        appearance: secondary
        query:
          requestId:
            bind: state.selected_request_id
  edit_request:
    kind: record_detail
    table: requests
    data_source: selected_request
    mode: editable
    save_mode: explicit
    save_label: Save request
    show_primary_key: false
    empty_message: Choose a request from the register.
    header:
      title_field:
        field: title
        mode: edit
      meta_fields:
        - field: status
          mode: edit
          ui:
            variant: badge
        - field: priority
          mode: edit
          ui:
            variant: badge
    sections:
      - id: ownership
        title: Ownership and timing
        columns: 2
        fields:
          - field: requester
            mode: edit
          - field: owner
            mode: edit
          - field: due_date
            mode: edit
      - id: request
        title: Request
        fields:
          - field: description
            mode: edit
            contentFormat: markdown
            ui:
              variant: markdown
              width: full
      - id: decision
        title: Decision
        fields:
          - field: decision_notes
            mode: edit
            contentFormat: markdown
            ui:
              variant: markdown
              width: full

layout:
  kind: stack
  children:
    - component: edit_toolbar
    - component: edit_request
