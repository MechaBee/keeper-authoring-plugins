table: tasks
version: 2
primaryKey: id
idPrefix: task
displayField: name
rowAccess:
  mode: policy
  allOf:
    - kind: resource_grant
      resourceField: project_id
      directGrants: {table: project_user_access, resourceField: project_id, principalField: user_id}
      groupGrants: {table: project_group_access, resourceField: project_id, groupField: group_id}
      groupMemberships: {table: group_memberships, groupField: group_id, principalField: user_id}
mutationPolicy:
  allowedRoles: [admin]
validationPolicy:
  unique:
    - fields: [project_id, name]
      message: Task names must be unique within a project.
queryPaths:
  - id: by_name
    equalityFields: []
    orderFields: [name]
  - id: by_archived_name
    equalityFields: [archived]
    orderFields: [name]
  - id: by_archived_project_name
    equalityFields: [archived, project_id]
    orderFields: [name]
fields:
  - {id: id, type: text, label: ID, required: true, readonly: true}
  - {id: project_id, type: reference, label: Project, referenceTable: projects, required: true}
  - {id: name, type: text, label: Task, required: true}
  - {id: archived, type: boolean, label: Archived, required: true, default: false}
  - {id: created_at, type: datetime, label: Created, readonly: true, computed: {kind: now, on: create, format: datetime}}
  - {id: updated_at, type: datetime, label: Updated, readonly: true, computed: {kind: now, on: always, format: datetime}}
relations:
  - field: project_id
    references: {table: projects, field: id}
    onDelete: block
