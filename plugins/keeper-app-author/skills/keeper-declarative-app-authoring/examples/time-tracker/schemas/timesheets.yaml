table: timesheets
version: 2
primaryKey: id
idPrefix: timesheet
displayField: week_start
rowAccess:
  mode: policy
  allOf:
    - kind: owner
      ownerField: owner_user_id
      adminCreateAssignment: resolved_principal
mutationPolicy:
  allowedRoles: [editor, developer, admin]
  channels:
    direct:
      operations: [create]
    workflow:
      operations: [create]
      workflowIds: [create_time_entry, create_admin_time_entry, duplicate_time_entry, quick_add_time_entry]
validationPolicy:
  unique:
    - fields: [owner_user_id, week_start]
      message: This member already has a timesheet for that week.
  checks:
    - id: monday_week_start
      operations: [create, update]
      message: A timesheet week must start on Monday.
      input:
        candidate: {kind: candidate}
      code: |
        const candidate = input.candidate;
        const value = String(candidate.week_start ?? "");
        if (!/^\d{4}-\d{2}-\d{2}$/.test(value)) return false;
        return new Date(`${value}T00:00:00Z`).getUTCDay() === 1;
queryPaths:
  - id: by_week_start
    equalityFields: []
    orderFields: [week_start]
  - id: by_owner_week_start
    equalityFields: [owner_user_id]
    orderFields: [week_start]
fields:
  - {id: id, type: text, label: ID, required: true, readonly: true}
  - {id: owner_user_id, type: reference, label: Owner, referenceTable: keeper_principals, required: true, readonly: true}
  - {id: week_start, type: date, label: Week starting, required: true, helpText: Select the Monday that begins this week.}
  - {id: created_at, type: datetime, label: Created, readonly: true, computed: {kind: now, on: create, format: datetime}}
  - {id: updated_at, type: datetime, label: Updated, readonly: true, computed: {kind: now, on: always, format: datetime}}
