table: groups
version: 2
primaryKey: id
idPrefix: group
displayField: name
rowAccess:
  mode: policy
  allOf:
    - kind: app_role
      anyOf: [admin]
mutationPolicy:
  allowedRoles: [admin]
validationPolicy:
  unique:
    - fields: [name]
      message: Group names must be unique.
queryPaths:
  - id: by_name
    equalityFields: []
    orderFields: [name]
fields:
  - {id: id, type: text, label: ID, required: true, readonly: true}
  - {id: name, type: text, label: Name, required: true}
  - {id: active, type: boolean, label: Directory status, required: true, default: true, helpText: Informational only. Clear memberships or project grants to revoke access.}
  - {id: created_at, type: datetime, label: Created, readonly: true, computed: {kind: now, on: create, format: datetime}}
  - {id: updated_at, type: datetime, label: Updated, readonly: true, computed: {kind: now, on: always, format: datetime}}
