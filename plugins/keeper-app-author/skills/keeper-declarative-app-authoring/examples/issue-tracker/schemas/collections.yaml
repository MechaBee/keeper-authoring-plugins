table: collections
version: 1
primaryKey: id
idPrefix: coll
displayField: name
# A collection is a workspace folder; the files in it are its documents. Each
# issue that needs documents gets its own folder: the solution design and
# anything people add next to it.
role: collection
rowAccess: {mode: all}
mutationPolicy:
  allowedRoles: [editor, developer, admin]
fields:
  - {id: id, type: text, label: ID, required: true, readonly: true}
  - {id: name, type: text, label: Name, required: true}
  - {id: description, type: textarea, label: Description}
  - {id: folder, type: text, label: Folder, managed: role, readonly: true}
  - {id: field_definitions, type: json, label: Document fields}
  # No agent_tasks option: every issue folder accepts the Agent's documents.
  - id: features
    type: multi_select
    label: Features
    options: [comments, review_status]
  - {id: archived, type: boolean, label: Archived}
