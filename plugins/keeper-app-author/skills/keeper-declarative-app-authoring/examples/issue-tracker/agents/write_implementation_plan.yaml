id: write_implementation_plan
title: Write an implementation plan
description: "Use for an issue given to the Agent whose solution is already clear and needs no design choices: a contained fix or change that a developer can start on at once. Reads the issue, its conversation, sub-issues, links, documents and the code you can see, then files a step-by-step implementation plan in the issue's documents for review. Use write_solution_design instead when the approach still has real choices, and ask_questions when you can't proceed without answers."
kind: task
exposure: {mcp: true}
allowed_roles: [editor, developer, admin]
input:
  # Only open issues the Agent holds and can work now: the picker is the Ready queue.
  - id: issue_id
    type: reference
    label: Issue
    referenceTable: issues
    required: true
    reference_where: {assignee_kind: agent, agent_status: ready, state: open}
target: {table: issues, id: {bind: input.issue_id}}
context:
  issue:
    {kind: record, table: issues, id: {bind: input.issue_id}, required: true, label: The issue}
  project:
    {kind: record, table: projects, id: {bind: context.issue.project_id}, label: Project}
  conversation:
    kind: table
    table: issue_activity
    filter: {issue_id: {bind: input.issue_id}}
    sort: {field: occurred_at, direction: asc}
    limit: 300
    label: Conversation and events
  sub_issues:
    kind: table
    table: issues
    filter: {parent_issue_id: {bind: input.issue_id}}
    sort: {field: number, direction: asc}
    limit: 50
    label: Sub-issues
  links:
    kind: table
    table: issue_links
    filter: {source_issue_id: {bind: input.issue_id}}
    limit: 50
    label: Linked issues
  documents:
    kind: documents
    record:
      table: issues
      id: {bind: input.issue_id}
      collection_field: collection_id
      link_table: issue_documents
    limit: 20
    label: The issue's documents
guide: ai/write-implementation-plan.md
executor: {kind: agent}
output:
  documents:
    plan:
      op: create
      collection: {bind: context.issue.collection_id}
      fields: [summary]
      max_bytes: 131072
  records:
    handover: {table: issue_activity, op: create, fields: [body]}
commit: {mode: on_result, workflow: commit_implementation_plan}
limits: {timeout_s: 3600}
