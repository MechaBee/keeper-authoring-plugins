table: current_rules
version: 1
primaryKey: id
idPrefix: current_rule
displayField: rule_name
fields:
  - id: id
    type: text
    label: ID
    required: true
    readonly: true
  - id: rule_id
    type: reference
    label: Rule
    required: true
    referenceTable: rules
  - id: version_id
    type: reference
    label: Version
    required: true
    referenceTable: rule_versions
  - id: rule_name
    type: text
    label: Rule
    required: true
  - id: category
    type: select
    label: Category
    required: true
    options:
      - value: service_level
        label: Service level
      - value: quality_threshold
        label: Quality threshold
      - value: operating_limit
        label: Operating limit
  - id: effective_from
    type: date
    label: Effective from
    required: true
  - id: effective_to
    type: date
    label: Effective to
  - id: value
    type: number
    label: Value
    required: true
  - id: unit
    type: text
    label: Unit
    required: true
  - id: last_change_reason
    type: select
    label: Last change
    required: true
    options:
      - value: initial
        label: Initial
      - value: manual_update
        label: Manual update
      - value: correction
        label: Correction
relations:
  - field: rule_id
    references:
      table: rules
      field: id
  - field: version_id
    references:
      table: rule_versions
      field: id
