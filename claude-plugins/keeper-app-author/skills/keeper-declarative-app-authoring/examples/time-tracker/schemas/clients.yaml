table: clients
version: 2
primaryKey: id
idPrefix: client
displayField: name
rowAccess:
  mode: policy
  allOf:
    - kind: related_resource_grant
      resourceTable: projects
      resourceField: client_id
      targetField: id
mutationPolicy:
  allowedRoles: [admin]
validationPolicy:
  unique:
    - fields: [name]
      message: Client names must be unique.
queryPaths:
  - id: by_name
    equalityFields: []
    orderFields: [name]
  - id: by_archived_name
    equalityFields: [archived]
    orderFields: [name]
fields:
  - {id: id, type: text, label: ID, required: true, readonly: true}
  - {id: name, type: text, label: Client, required: true}
  - {id: archived, type: boolean, label: Archived, required: true, default: false}
  - {id: created_at, type: datetime, label: Created, readonly: true, computed: {kind: now, on: create, format: datetime}}
  - {id: updated_at, type: datetime, label: Updated, readonly: true, computed: {kind: now, on: always, format: datetime}}
