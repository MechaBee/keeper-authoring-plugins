table: opportunities
version: 1
primaryKey: id
idPrefix: opportunity
displayField: title
rowAccess: {mode: all}
mutationPolicy:
  allowedRoles: [editor, admin]
  channels:
    direct: {operations: [create, update]}
    agent: {operations: [update], taskIds: [draft_proposal]}
fields:
  - {id: id, type: text, label: ID, readonly: true, required: true}
  - {id: title, type: text, label: Title, required: true}
  - {id: customer_id, type: reference, label: Customer, referenceTable: customers, required: true}
  - {id: requirements_path, type: text, label: Requirements document}
  - {id: proposal_summary, type: textarea, label: Proposal summary, contentFormat: markdown}
  - {id: proposal_path, type: text, label: Proposal document}
