view:
  id: setup_templates
  title: Templates
  description: Templates appear as cards in the New issue dialog and pre-fill its title, type and description.
nav:
  order: 60
  icon: file-text
  group:
    id: setup
    label: Setup
    icon: settings
    order: 90
access:
  allowed_roles: [admin]
state:
  selected_template_id: null
data_sources:
  templates:
    kind: table
    table: issue_templates
    sort: {field: position, direction: asc}
  template_create_action:
    kind: provider_resource
    provider: workspace
    resource: record_create_action
    params:
      table: issue_templates
      label: New template
      fields: name,description,issue_type,title_prefix,body,default_labels,position
      field__active: true
      field__position: 100
    on_success:
      - {type: refresh, data_sources: [templates]}
      - {type: set_state, key: selected_template_id, value: {bind: action.result.id}}
components:
  templates_workspace:
    kind: record_collection
    title: Issue templates
    table: issue_templates
    data_source: templates
    search: {enabled: true, placeholder: Search templates, fields: [name, description]}
    create: {data_source: template_create_action, label: New template}
    delete: {enabled: true, label: Delete, confirm: Delete this template? Issues opened from it are not affected., mode: block}
    selection:
      state_key: selected_template_id
      desktop: split
      mobile: page
      reconcile: first_available
    summary:
      title_field: name
      badge_field: issue_type
      meta_fields: [description, active]
    detail:
      title: Template
      mode: editable
      save_mode: explicit
      save_label: Save template
      density: compact
      show_primary_key: false
      sections:
        - id: offer
          title: In the New issue dialog
          columns: 2
          fields:
            - {field: name, mode: edit}
            - {field: description, mode: edit}
            - {field: position, mode: edit}
            - {field: active, mode: edit}
        - id: prefill
          title: What it fills in
          columns: 2
          fields:
            - {field: title_prefix, mode: edit}
            - {field: issue_type, mode: edit}
            - {field: default_labels, mode: edit, ui: {width: full}}
            - {field: body, mode: edit, ui: {variant: markdown, width: full}}
layout:
  component: templates_workspace
