view:
  id: document
  title: Document
nav:
  visible: false
state:
  document_id: null
route_state:
  document_id: {route: documentId, mode: sync}
data_sources:
  document:
    kind: provider_resource
    provider: workspace
    resource: document
    params:
      document_id: {bind: state.document_id}
    refresh_on: [state.document_id]
  review:
    kind: provider_resource
    provider: workspace
    resource: comments
    params:
      table: document_comments
      target_id: {bind: state.document_id}
    refresh_on: [state.document_id]
components:
  page:
    kind: document_page
    data_source: document
    empty_message: This document doesn't exist, or you can't open it.
    record_views:
      issues: {view: issue, query_param: issueId}
  review_threads:
    kind: comments
    title: Comments
    data_source: review
    empty_message: No comments. Select a passage in the text to comment on it. The Agent reads them when it revises a design.
layout:
  kind: split
  direction: horizontal
  sizes: [3, 2]
  children:
    - component: page
    - component: review_threads
