table: issue_templates
version: 2
primaryKey: id
idPrefix: template
displayField: name
rowAccess:
  mode: all
mutationPolicy:
  allowedRoles: [admin]
relations:
  - field: issue_type
    references: {table: issue_types, field: id}
    onDelete: block
  - field: default_labels
    references: {table: labels, field: id}
    onDelete: block
validationPolicy:
  unique:
    - fields: [name]
      message: Another template already uses this name.
fields:
  - {id: id, type: text, label: ID, required: true, readonly: true}
  - {id: name, type: text, label: Name, required: true}
  - {id: description, type: text, label: When to use it}
  - {id: title_prefix, type: text, label: Title starts with, helpText: "Pre-filled into the title, for example \"Bug: \"."}
  - {id: body, type: textarea, label: Description skeleton, contentFormat: markdown}
  - id: issue_type
    type: reference
    label: Type
    referenceTable: issue_types
    reference_where: {active: true}
    required: true
    default: task
  - id: default_labels
    type: reference
    label: Labels added automatically
    referenceTable: labels
    reference_where: {active: true}
    multiple: true
  - {id: position, type: number, label: Order, required: true, default: 100, step: 1}
  - {id: active, type: boolean, label: Offered, required: true, default: true}
  - {id: created_at, type: datetime, label: Created, readonly: true, computed: {kind: now, on: create, format: datetime}}
  - {id: updated_at, type: datetime, label: Updated, readonly: true, computed: {kind: now, on: always, format: datetime}}
